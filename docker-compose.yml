# Development-only PostgreSQL. Production uses an external, managed server
# configured through DATABASE_URL (see docs/backend.md).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gymbo
      POSTGRES_USER: gymbo
      POSTGRES_PASSWORD: gymbo-dev-password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - gymbo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbo -d gymbo"]
      interval: 5s
      retries: 10

volumes:
  gymbo_pgdata:
