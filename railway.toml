# Railway configuration as code (https://docs.railway.com/reference/config-as-code).
# Builds the Dockerfile's final stage (prod: Gunicorn). Secrets and hosts are
# service variables in the Railway dashboard, never in this file — see README §Railway.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Applies pending migrations before the new version takes traffic; if it fails,
# the deploy stops and the previous version keeps running.
preDeployCommand = ["python manage.py migrate --noinput"]
healthcheckPath = "/health/ready/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
